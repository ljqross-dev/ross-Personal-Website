<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="spBody" x1="18" y1="12" x2="62" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB8E8"/>
      <stop offset=".35" stop-color="#C084FC"/>
      <stop offset=".7" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="spCore" x1="32" y1="28" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7ED" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="spGlass" x1="20" y1="16" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="40" cy="40" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="spBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="spSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- soft contact shadow -->
  <ellipse cx="40" cy="68" rx="18" ry="4.5" fill="#C4B5FD" opacity=".35" filter="url(#spSoft)"/>
  <!-- ambient glow -->
  <circle cx="40" cy="38" r="26" fill="url(#spGlow)" filter="url(#spBlur)"/>
  <!-- back facet -->
  <path d="M40 10 L58 28 L40 66 L22 28 Z" fill="url(#spBody)" opacity=".55"/>
  <!-- front crystal body -->
  <path d="M40 14 L54 30 L40 62 L26 30 Z" fill="url(#spBody)"/>
  <!-- glass overlay -->
  <path d="M40 14 L54 30 L40 62 L26 30 Z" fill="url(#spGlass)"/>
  <!-- inner core -->
  <ellipse cx="40" cy="36" rx="7" ry="10" fill="url(#spCore)"/>
  <!-- specular highlight -->
  <path d="M34 20 C36 17 42 17 44 21 C42 24 36 25 34 20Z" fill="#fff" opacity=".85"/>
  <path d="M30 32 C31 29 34 28 35 31" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <!-- small sparkles -->
  <circle cx="56" cy="22" r="2.2" fill="#fff" opacity=".9"/>
  <circle cx="22" cy="44" r="1.6" fill="#A5F3FC" opacity=".85"/>
  <path d="M58 40 l1.4 3.2 3.2.2-2.5 2.1.8 3.1-2.9-1.7-2.9 1.7.8-3.1-2.5-2.1 3.2-.2z" fill="#FDE68A" opacity=".95"/>
</svg>
