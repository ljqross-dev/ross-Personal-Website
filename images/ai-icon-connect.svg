<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="cnA" x1="14" y1="14" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cnB" x1="46" y1="46" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cnLink" x1="28" y1="28" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset=".5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cnGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <filter id="cnSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <ellipse cx="40" cy="70" rx="18" ry="4" fill="#93C5FD" opacity=".3" filter="url(#cnSoft)"/>
  <!-- link tube -->
  <path d="M30 30 C38 34 42 42 50 50" stroke="url(#cnLink)" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <path d="M30 30 C38 34 42 42 50 50" stroke="url(#cnLink)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M30 30 C38 34 42 42 50 50" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  <!-- node A glass orb -->
  <circle cx="24" cy="24" r="13" fill="url(#cnA)" opacity=".95"/>
  <circle cx="24" cy="24" r="13" fill="url(#cnGlass)"/>
  <circle cx="24" cy="24" r="13" stroke="#fff" stroke-width="1.3" stroke-opacity=".65"/>
  <ellipse cx="20" cy="19" rx="5" ry="3.2" fill="#fff" opacity=".75"/>
  <!-- node B glass orb -->
  <circle cx="56" cy="56" r="13" fill="url(#cnB)" opacity=".95"/>
  <circle cx="56" cy="56" r="13" fill="url(#cnGlass)"/>
  <circle cx="56" cy="56" r="13" stroke="#fff" stroke-width="1.3" stroke-opacity=".65"/>
  <ellipse cx="52" cy="51" rx="5" ry="3.2" fill="#fff" opacity=".7"/>
  <!-- tiny side stubs -->
  <rect x="48" y="16" width="12" height="5" rx="2.5" fill="#E9D5FF" opacity=".85" transform="rotate(18 54 18.5)"/>
  <rect x="16" y="52" width="5" height="12" rx="2.5" fill="#BAE6FD" opacity=".85"/>
</svg>
